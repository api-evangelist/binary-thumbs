aid: binary-thumbs
name: Binary Thumbs
description: >-
  Binary Thumbs (operating name "Binary Thumb", Y Combinator Summer 2012) was a
  San Francisco startup founded in 2012 by Josh Leong, Michael Lin, and Matt
  Monson to reinvent the spreadsheet for touch devices. Its single product,
  Grid, was a collaborative grid-based spreadsheet and organizational app for
  iPad and iPhone that let people keep notes, pictures, people, and places in a
  freeform grid rather than rigid rows and columns. The company raised roughly
  $2.15M across a 2012 YC round and a 2013 seed, with participation from angel
  and institutional investors, and appears on the Andreessen Horowitz public
  investment list. Y Combinator now lists the company as inactive; Josh Leong
  led it as CEO from 2012 to 2016. Binary Thumb never shipped a public API,
  developer portal, or documentation surface -- it was a consumer iOS product
  company. Its lasting public technical footprint is the BinaryThumb GitHub
  organization and a handful of open-source React and JavaScript utility
  libraries published to npm.
